{% extends "base.html" %}
{% block content %}
<div class="auth">
  <h1>Login</h1>
  <p class="muted">Use your student or admin account.</p>
  <form method="post">
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn" type="submit">Login</button>
  </form>
  <div class="demo">
    <b>Demo student:</b> student@canteen.local / student123<br>
    <b>Demo admin:</b> admin@canteen.local / admin123
  </div>
</div>
{% endblock %}
