{% extends "base.html" %}
{% block content %}
<p class="eyebrow">ORDER HISTORY</p><h1>My Orders</h1>
<div class="table-wrap"><table>
<tr><th>Order</th><th>Code</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr>
{% for o in orders %}
<tr><td>#{{ o.id }}</td><td><b>{{ o.order_code }}</b></td><td>₹{{ '%.2f'|format(o.total) }}</td><td>{{ o.payment_status }}</td><td><span class="status-pill">{{ o.status }}</span></td><td>{{ o.created_at }}</td></tr>
{% else %}<tr><td colspan="6">No orders yet.</td></tr>{% endfor %}
</table></div>
{% endblock %}
